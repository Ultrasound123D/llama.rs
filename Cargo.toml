[workspace]
resolver = "2"
members = [
    "crates/llama-gguf",
    "crates/llama-quant",
    "crates/llama-kernels",
    "crates/llama-core",
    "apps/llama-rs-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
debug = false
opt-level = 3
lto = "thin"
codegen-units = 1
